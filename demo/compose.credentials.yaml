# Used by demo/start_local.py. No credentials are stored in container env.
services:
  backend:
    environment: &refreshable_credentials
      AWS_PROFILE: ava-demo
      AWS_PROFILE_NAME: ava-demo
      AWS_CONFIG_FILE: /opt/ava-credentials/config
      AWS_SHARED_CREDENTIALS_FILE: /dev/null
      AWS_ACCESS_KEY_ID: null
      AWS_SECRET_ACCESS_KEY: null
      AWS_SESSION_TOKEN: null
    volumes:
      - ${AVA_CREDENTIAL_SOCKET_DIR:?Run demo/start_local.py}:/run/ava-credentials:ro
      - ../../demo/credentials:/opt/ava-credentials:ro
      - ../../demo/credentials:/root/.aws:ro
  gateway:
    environment: *refreshable_credentials
    volumes:
      - ${AVA_CREDENTIAL_SOCKET_DIR:?Run demo/start_local.py}:/run/ava-credentials:ro
      - ../../demo/credentials:/opt/ava-credentials:ro
      - ../../demo/credentials:/root/.aws:ro
