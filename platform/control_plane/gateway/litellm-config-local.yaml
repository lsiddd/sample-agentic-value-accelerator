# Low-cost demo catalog. No Mantle key or premium-model fallback.
# Prices: AWS Bedrock standard tier, us-east-1, checked 2026-09-09.
model_list:
- model_name: Amazon Nova Lite
  litellm_params:
    model: bedrock/us.amazon.nova-lite-v1:0
    aws_region_name: os.environ/AWS_REGION_NAME
    max_tokens: 4096
  model_info:
    mode: chat
    input_cost_per_token: 6.0e-08
    output_cost_per_token: 2.4e-07
- model_name: us.amazon.nova-lite-v1:0
  litellm_params:
    model: bedrock/us.amazon.nova-lite-v1:0
    aws_region_name: os.environ/AWS_REGION_NAME
    max_tokens: 4096
  model_info:
    mode: chat
    input_cost_per_token: 6.0e-08
    output_cost_per_token: 2.4e-07
- model_name: GLM 4.7 Flash
  litellm_params:
    model: bedrock/zai.glm-4.7-flash
    aws_region_name: os.environ/AWS_REGION_NAME
    max_tokens: 4096
  model_info:
    mode: chat
    input_cost_per_token: 7.0e-08
    output_cost_per_token: 4.0e-07
- model_name: zai.glm-4.7-flash
  litellm_params:
    model: bedrock/zai.glm-4.7-flash
    aws_region_name: os.environ/AWS_REGION_NAME
    max_tokens: 4096
  model_info:
    mode: chat
    input_cost_per_token: 7.0e-08
    output_cost_per_token: 4.0e-07
litellm_settings:
  drop_params: true
  set_verbose: false
  cache: true
  cache_params:
    type: redis
    host: os.environ/REDIS_HOST
    port: 6379
    password: os.environ/REDIS_PASSWORD
  num_retries: 2
  request_timeout: 60
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  timeout: 30
